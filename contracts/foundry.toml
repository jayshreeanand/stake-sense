[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/"
]
solc = "0.8.25"
optimizer = true
optimizer_runs = 200
auto_detect_remappings = true

[rpc_endpoints]
swellchain = "https://swellchain-mainnet.infura.io/v3/aaab7e0d1d4840f291f484c3fe1110bf"
swellchain_testnet = "https://swell-testnet.alt.technology" 